<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوت‌نامه تولد هلن</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #342719, #100e0b 65%);
    color: #f8e5b0;
    font-family: Tahoma, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 22px;
}

.card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    padding: 38px 24px;
    border: 1px solid #c9a45b;
    border-radius: 180px 180px 22px 22px;
    background: linear-gradient(160deg, #201a12, #090807);
    box-shadow: 0 0 45px #c9a45b25;
    animation: appear 1.5s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.crown {
    font-size: 42px;
    margin-bottom: 10px;
}

.small {
    color: #d1b779;
    font-size: 13px;
    letter-spacing: 2px;
}

h1 {
    font-size: 46px;
    color: #f4d58c;
    margin: 22px 0;
    text-shadow: 0 0 20px #d5a74b55;
}

.line {
    width: 100px;
    height: 1px;
    background: #c9a45b;
    margin: 25px auto;
}

.message {
    color: #f6e9cd;
    line-height: 2.4;
    font-size: 15px;
}

.details {
    margin-top: 28px;
    padding: 18px 12px;
    border: 1px solid #6f5730;
    border-radius: 14px;
    line-height: 2.5;
    color: #e8cc8e;
}

button {
    margin-top: 25px;
    padding: 14px 25px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, #b58a3c, #f5dfa2);
    color: #17110a;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
}

.footer {
    margin-top: 28px;
    font-size: 12px;
    color: #a99570;
}

.star {
    position: fixed;
    top: -20px;
    color: #e9c878;
    animation: fall linear infinite;
    pointer-events: none;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="card">
    <div class="crown">✧ 👑 ✧</div>

    <div class="small">YOU ARE INVITED</div>

    <h1>هلن</h1>

    <div class="line"></div>

    <div class="message">
        بعض لحظه‌ها با حضور آدم‌های خاص<br>
        به خاطره‌هایی فراموش‌نشدنی تبدیل می‌شن...<br><br>

        با عشق دعوتی به جشن تولد من؛<br>
        تا کنار هم شبی زیبا و خاطره‌انگیز بسازیم. ✨
    </div>

    <div class="details">
        ♡ تاریخ جشن ♡<br>
        ۲۴ مهر ۱۴۰۵

        <br>

        ♡ محل برگزاری ♡<br>
        پیچ ساغرون
    </div>

    <button onclick="document.getElementById('end').scrollIntoView({behavior:'smooth'})">
        با عشق منتظرت هستم ♡
    </button>

    <div class="footer" id="end">
        یک شب خاص، در کنار آدم‌های خاص
    </div>
</div>

<script>
for (let i = 0; i < 24; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.textContent = '✦';
    star.style.left = Math.random() * 100 + 'vw';
    star.style.animationDuration = (5 + Math.random() * 8) + 's';
    star.style.animationDelay = Math.random() * 8 + 's';
    star.style.fontSize = (10 + Math.random() * 12) + 'px';
    document.body.appendChild(star);
}
</script>

</body>
  </html>
